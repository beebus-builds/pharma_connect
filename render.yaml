services:
  - type: web
    name: pharmaconnect-realtime
    runtime: docker
    plan: free
    dockerContext: ./pharmaconnect
    dockerfilePath: ./pharmaconnect/realtime/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: REDIS_URL
        sync: false
